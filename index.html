<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Playground</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>JS Event Playground 🎮</h1>
    <p>Explore events, interactions, and validations!</p>
  </header>

  <main>
    <!-- 1. Button & Hover -->
    <section class="interactions">
      <button id="changeColorBtn">Click Me!</button>
      <div id="hoverBox">Hover Over Me</div>
    </section>

    <!-- 2. Keypress -->
    <section>
      <p>Type something below 👇</p>
      <input type="text" id="keyInput" placeholder="Start typing..." />
      <p id="keyOutput"></p>
    </section>

    <!-- 3. Tabs -->
    <section class="tabs">
      <button class="tab" data-target="tab1">Tab 1</button>
      <button class="tab" data-target="tab2">Tab 2</button>
      <div id="tab1" class="tab-content active">This is Tab 1 content 🎉</div>
      <div id="tab2" class="tab-content">This is Tab 2 content 🚀</div>
    </section>

    <!-- 4. Form -->
    <section class="form-section">
      <form id="myForm">
        <input type="text" id="name" placeholder="Your Name" required />
        <input type="email" id="email" placeholder="Your Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <small id="passwordFeedback"></small>
        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Made with 💻 + ❤️ in JS Land</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
